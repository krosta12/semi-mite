plugins {
    id 'java-library'
}

group = 'org.example'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

repositories {
    mavenCentral()
}

dependencies {
}

tasks.register('runExample', JavaExec) {
    group = 'application'
    description = 'Runs the manual test example (org.example.example.Main)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.example.Main'
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
}