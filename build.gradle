plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'io.github.krosta12'
version = '0.1.7'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
    test {
        testLogging {
            events "passed", "failed", "skipped"
        }
    }
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    coordinates("io.github.krosta12", "semi-mite", "0.1.7")

    pom {
        name = "semi-mite"
        description = "Call C++ from Java without JNI, built on Project Panama (FFM API)."
        inceptionYear = "2026"
        url = "https://github.com/krosta12/semi-mite"

        licenses {
            license {
                name = "MIT"
                url = "https://opensource.org/licenses/MIT"
            }
        }
        developers {
            developer {
                id = "krosta12"
                name = "krosta12"
                url = "https://github.com/krosta12"
            }
        }
        scm {
            url = "https://github.com/krosta12/semi-mite"
            connection = "scm:git:git://github.com/krosta12/semi-mite.git"
            developerConnection = "scm:git:ssh://git@github.com/krosta12/semi-mite.git"
        }
    }
}